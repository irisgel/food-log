<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Food log">
<meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141f" media="(prefers-color-scheme: dark)">
<title>Food log</title>
<style>
  :root { --bg: #f5f6fb; --text: #1f2340; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12141f; --text: #e8eaf6; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
  p { font: 16px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; padding: 24px; margin: 0; }
</style>
</head>
<body>
<script>
  // Frame for the Food log dashboard (Google Apps Script). Showing it inside this page hides
  // Google's grey "created by a Google Apps Script user" bar. The token lives after the # in
  // your link: that part never leaves your phone, and nothing secret is stored in this file.
  var EXEC = 'https://script.google.com/macros/s/AKfycbwHUmr17afIXyOmBJixrA1BlSR2iMYxnSwT1xizTdwFHK9AmlZZfzE3n7yQuRci6QB1JA/exec';
  var token = decodeURIComponent(location.hash.slice(1));
  if (!token) {
    document.body.innerHTML = '<p>Open this from your Food log link (the one with # at the end).</p>';
  } else {
    var f = document.createElement('iframe');
    f.title = 'Food log';
    f.src = EXEC + '?token=' + encodeURIComponent(token);
    document.body.appendChild(f);
  }
</script>
</body>
</html>
